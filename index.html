<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Cozy House | Home</title>
    <link
      rel="stylesheet"
      href="./styles/style.css"
    />
    <script
      src="./scripts/app.js"
      defer
      type="module"
    ></script>
  </head>
  <body>
    <div class="background-start-wrapper">
      <header
        class="header"
        data-js-header
      >
        <div class="header__inner container">
          <a
            class="header__logo logo"
            href="#"
          >
            <h1 class="logo__title">Cozy House</h1>
            <span class="logo__subtitle">Shelter for pets in Boston</span>
          </a>
          <nav
            class="header__menu"
            data-js-menu
          >
            <ul class="header__menu-list">
              <li class="header__menu-item">
                <a
                  class="header__menu-link is-active paragraph-l"
                  href="#"
                  data-js-menu-link
                  >About the shelter
                </a>
              </li>
              <li class="header__menu-item">
                <a
                  class="header__menu-link paragraph-l"
                  href="#"
                  >Our pets
                </a>
              </li>
              <li class="header__menu-item">
                <a
                  class="header__menu-link paragraph-l"
                  href="#"
                  >Help the shelter
                </a>
              </li>
              <li class="header__menu-item">
                <a
                  class="header__menu-link paragraph-l"
                  href="#"
                  >Contacts
                </a>
              </li>
            </ul>
          </nav>
          <div
            class="header__overlay"
            aria-hidden="true"
            data-js-overlay
          ></div>
          <button
            class="header__burger-menu"
            type="button"
            aria-label="Open menu"
            data-js-burger-button
          >
            <span
              class="header__burger-menu-line"
              aria-hidden="true"
            ></span
            ><span
              class="header__burger-menu-line"
              aria-hidden="true"
            ></span
            ><span
              class="header__burger-menu-line"
              aria-hidden="true"
            ></span>
          </button>
        </div>
      </header>
    </div>
  </body>
</html>
